<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Calendar</title>
<style>
:root{--bg:#fff;--fg:#1f2328;--mut:#656d76;--line:#d0d7de;--head:#f3f4f6;--acc:#1a73e8;--sel:#e8f0fe;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181c;--fg:#e6e8eb;--mut:#9aa1a9;--line:#3a3f46;--head:#23272d;--acc:#6ea8fe;--sel:#24324a}}
:root[data-theme="dark"]{--bg:#16181c;--fg:#e6e8eb;--mut:#9aa1a9;--line:#3a3f46;--head:#23272d;--acc:#6ea8fe;--sel:#24324a}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:var(--fg)}
button{background:var(--head);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;transition:border-color .15s,background .15s}
button:hover{border-color:var(--acc)}
.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
#bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px;border-bottom:1px solid var(--line)}
#title{font-size:17px;margin:0 6px;font-weight:600}
.sp{flex:1}
#search{width:140px}
.seg{display:flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:6px 0 0 6px;margin:0}
.seg button:last-child{border-radius:0 6px 6px 0}
.seg .on{background:var(--acc);color:#fff;border-color:var(--acc);position:relative}
#main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}
.mh{display:grid;grid-template-columns:repeat(7,1fr);color:var(--mut);text-align:center;padding:6px 0;border-bottom:1px solid var(--line)}
.mg{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(96px,1fr)}
.mc{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;cursor:pointer;overflow:hidden;min-width:0}
.mc:hover{background:var(--head)}
.mc.oth{color:var(--mut);background:var(--head)}
.dn{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;border-radius:50%;cursor:pointer}
.dn.td{background:var(--acc);color:#fff}
.chip{color:#fff;border-radius:4px;padding:1px 6px;margin-top:2px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.chip:hover{filter:brightness(1.1)}
.more{font-size:12px;color:var(--mut);margin-top:2px}
.hol{background:var(--head);color:var(--fg);border-left:3px solid #d93025;border-radius:4px;padding:1px 6px;margin-top:2px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hol.f{border-left-color:#e8710a}.hol.s{border-left-color:#8e24aa}
#leg{display:flex;gap:14px;flex-wrap:wrap;padding:6px 10px;border-top:1px solid var(--line);color:var(--mut);font-size:12px;align-items:center}
#leg i{display:inline-block;width:3px;height:12px;margin-right:5px;vertical-align:-2px}
.gh,.ga,.gb{display:grid;grid-template-columns:56px repeat(var(--n),minmax(0,1fr))}
.gh{border-bottom:1px solid var(--line);text-align:center;padding:6px 0;color:var(--mut)}
.gd{cursor:pointer}.gd.td b{background:var(--acc);color:#fff;border-radius:50%;padding:2px 7px}
.ga{border-bottom:1px solid var(--line);font-size:11px;color:var(--mut)}
.ga .gc{border-left:1px solid var(--line);padding:2px}
.gb{flex:1;overflow:auto;min-height:0;align-items:start}
.hl{height:48px;font-size:11px;color:var(--mut);text-align:right;padding-right:6px;box-sizing:border-box;transform:translateY(-7px)}
.gcol{position:relative;height:1152px;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 48px}
.ev{position:absolute;color:#fff;border-radius:4px;padding:2px 5px;font-size:12px;overflow:hidden;cursor:pointer;box-sizing:border-box;border:1px solid var(--bg)}
.now{position:absolute;left:0;right:0;height:2px;background:#d93025;pointer-events:none}
.ag{padding:12px;max-width:760px;width:100%;box-sizing:border-box;margin:0 auto}
.ag h3{margin:14px 0 6px;font-size:13px;color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
.row:hover{border-color:var(--acc)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.tm{color:var(--mut);min-width:78px}
.empty{color:var(--mut);text-align:center;padding:40px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:9}
.ov>div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;width:min(460px,92vw);max-height:90vh;overflow:auto;box-sizing:border-box}
.ov label{display:block;margin:8px 0 3px;color:var(--mut);font-size:12px}
.ov input:not([type=checkbox]),.ov select,.ov textarea{width:100%;box-sizing:border-box}
.r2{display:flex;gap:8px}.r2>div{flex:1}
#cats{display:flex;gap:6px;flex-wrap:wrap}
.cat{padding:3px 10px;border-radius:14px;color:#fff;cursor:pointer;opacity:.45;font-size:12px}
.cat.on{opacity:1;outline:2px solid var(--fg);outline-offset:1px}
.btns{display:flex;gap:6px;margin-top:12px}
</style>
</head>
<body>
<div id="bar">
  <button id="today">Today</button><button id="prev">‹</button><button id="next">›</button>
  <h1 id="title"></h1><span class="sp"></span>
  <input id="search" placeholder="Search events">
  <div class="seg"><button data-v="month">Month</button><button data-v="week">Week</button><button data-v="day">Day</button><button data-v="agenda">Agenda</button></div>
  <label style="display:flex;gap:4px;align-items:center;color:var(--mut)"><input type="checkbox" id="showh" checked> Festivals</label>
  <button class="pri" id="add">+ Event</button><button id="bk">Backup</button>
</div>
<div id="main"></div>
<div id="leg"><span><i style="background:#d93025"></i>Public holiday</span><span><i style="background:#e8710a"></i>Festival</span><span><i style="background:#8e24aa"></i>Special day</span><span>* date depends on moon sighting. Lunar festival dates are listed for 2026–2027 and may vary by region.</span></div>

<div class="ov" id="evd"><div>
  <input id="f_title" placeholder="Event title">
  <label>Category</label><div id="cats"></div>
  <div class="r2"><div><label>Date</label><input type="date" id="f_date"></div>
  <div><label>Repeat</label><select id="f_rep"><option value="none">Does not repeat</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select></div></div>
  <label><input type="checkbox" id="f_all"> All day</label>
  <div class="r2" id="times"><div><label>Start</label><input type="time" id="f_start"></div><div><label>End</label><input type="time" id="f_end"></div></div>
  <label>Notes</label><textarea id="f_notes" rows="3"></textarea>
  <div class="meta" style="color:var(--mut);font-size:12px;margin-top:6px">Changes to a repeating event apply to the whole series.</div>
  <div class="btns"><button class="pri" id="save">Save</button><button id="cancel">Cancel</button><span class="sp"></span><button id="del">Delete</button></div>
</div></div>

<div class="ov" id="bkd"><div>
  <p style="margin-top:0;color:var(--mut)">Copy your backup (JSON) or paste one to restore. Restoring adds events and keeps your existing ones.</p>
  <textarea id="ta" rows="9" style="width:100%;box-sizing:border-box"></textarea>
  <div class="btns"><button id="exj">Create backup</button><button id="cp">Copy</button><button id="imj">Restore</button><span class="sp"></span><button id="bcl">Close</button></div>
</div></div>

<script>
const K='mycal.v1',$=id=>document.getElementById(id);
let DB={events:[]};try{const d=JSON.parse(localStorage.getItem(K));if(d&&d.events)DB=d}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(DB))}catch(e){}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const wk=d=>addD(d,-((d.getDay()+6)%7));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ft=t=>{const h=+t.slice(0,2);return(h%12||12)+':'+t.slice(3)+' '+(h<12?'AM':'PM')};
const mi=t=>+t.slice(0,2)*60+ +t.slice(3);
const COL={Work:'#1a73e8',Client:'#188038',Urgent:'#d93025','Follow-up':'#e8710a',Personal:'#8e24aa',Birthday:'#d81b60',Other:'#00897b'};
const col=e=>COL[e.cat]||COL.Work;
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
/* festivals & special days */
const FIX=[[1,1,"New Year’s Day","s"],[1,13,"Lohri","f"],[1,26,"Republic Day","h"],[2,14,"Valentine’s Day","s"],[3,8,"International Women’s Day","s"],[4,14,"Ambedkar Jayanti / Baisakhi","h"],[5,1,"Labour Day","s"],[8,15,"Independence Day","h"],[9,5,"Teachers’ Day","s"],[10,2,"Gandhi Jayanti","h"],[10,31,"National Unity Day","s"],[11,14,"Children’s Day","s"],[12,24,"Christmas Eve","s"],[12,25,"Christmas","h"],[12,31,"New Year’s Eve","s"]];
const LUN=["2026-01-14|Makar Sankranti / Pongal|f","2026-01-23|Vasant Panchami|f","2026-03-03|Holika Dahan|f","2026-03-04|Holi|h","2026-03-21|Eid-ul-Fitr*|h","2026-03-26|Ram Navami|h","2026-03-31|Mahavir Jayanti|h","2026-04-03|Good Friday|h","2026-04-05|Easter|s","2026-05-01|Buddha Purnima|h","2026-05-27|Eid-ul-Adha (Bakrid)*|h","2026-06-26|Muharram*|h","2026-08-26|Onam|f","2026-08-26|Eid-e-Milad*|h","2026-08-28|Raksha Bandhan|f","2026-09-04|Janmashtami|h","2026-09-14|Ganesh Chaturthi|f","2026-10-20|Dussehra (Vijayadashami)|h","2026-11-06|Dhanteras|f","2026-11-07|Choti Diwali|f","2026-11-08|Diwali|h","2026-11-10|Govardhan Puja|f","2026-11-11|Bhai Dooj|f","2026-11-24|Guru Nanak Jayanti|h","2027-01-15|Pongal / Makar Sankranti|f","2027-03-10|Eid-ul-Fitr*|h","2027-03-21|Holika Dahan|f","2027-03-22|Holi|h","2027-03-26|Good Friday|h","2027-03-28|Easter|s","2027-04-07|Ugadi / Gudi Padwa|f","2027-04-15|Ram Navami|h","2027-05-17|Eid-ul-Adha (Bakrid)*|h","2027-06-16|Muharram*|h","2027-08-17|Raksha Bandhan|f","2027-08-25|Janmashtami|h","2027-09-04|Ganesh Chaturthi|f","2027-09-12|Onam|f","2027-09-30|Navratri begins|f","2027-10-09|Dussehra (Vijayadashami)|h","2027-10-27|Dhanteras|f","2027-10-29|Diwali|h","2027-11-04|Chhath Puja|f"];
const HOL={};
const addH=(k,n,t)=>{(HOL[k]=HOL[k]||[]).push({n,t})};
const nth=(y,m,wd,k)=>1+((wd-new Date(y,m,1).getDay()+7)%7)+7*(k-1);
for(let y=2024;y<=2035;y++){FIX.forEach(([m,d,n,t])=>addH(y+'-'+pad(m)+'-'+pad(d),n,t));
  addH(y+'-05-'+pad(nth(y,4,0,2)),"Mother’s Day",'s');addH(y+'-06-'+pad(nth(y,5,0,3)),"Father’s Day",'s')}
LUN.forEach(s=>{const[k,n,t]=s.split('|');addH(k,n,t)});
let showH=true;try{showH=localStorage.getItem('mycal.showh')!=='0'}catch(e){}
const hol=d=>showH?(HOL[ds(d)]||[]):[];
const hch=h=>`<div class="hol ${h.t}" title="${esc(h.n)}">${esc(h.n)}</div>`;
let view='month',cur=new Date(),q='',ed=null;cur.setHours(0,0,0,0);

function on(e,d){const b=pd(e.date);if(d<b)return false;const r=e.repeat||'none';
  if(r==='none')return ds(d)===e.date;if(r==='daily')return true;
  if(r==='weekly')return d.getDay()===b.getDay();if(r==='monthly')return d.getDate()===b.getDate();
  if(r==='yearly')return d.getDate()===b.getDate()&&d.getMonth()===b.getMonth();return false}
function evs(d){return DB.events.filter(e=>on(e,d)&&(!q||(e.title+' '+(e.notes||'')).toLowerCase().includes(q)))
  .sort((a,b)=>(a.allDay?'':a.start).localeCompare(b.allDay?'':b.start))}
const chip=e=>`<div class="chip" data-e="${e.id}" style="background:${col(e)}">${e.allDay?'':ft(e.start)+' '}${esc(e.title)}</div>`;

function titleText(){
  if(view==='month')return cur.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  if(view==='week'){const s=wk(cur),e=addD(s,6);return s.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' – '+e.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
  if(view==='day')return cur.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  return q?'Search results':'Upcoming events'}
function render(){
  document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  $('title').textContent=titleText();const m=$('main');
  if(view==='month')month(m);else if(view==='agenda')agenda(m);else grid(m,view==='week'?7:1)}
function month(m){
  const s=wk(new Date(cur.getFullYear(),cur.getMonth(),1)),t=ds(new Date());
  let h='<div class="mh">'+DAYS.map(x=>`<div>${x}</div>`).join('')+'</div><div class="mg">';
  for(let i=0;i<42;i++){const d=addD(s,i),k=ds(d),hh=hol(d),l=evs(d),room=Math.max(0,3-hh.length);
    h+=`<div class="mc${d.getMonth()!==cur.getMonth()?' oth':''}" data-d="${k}"><span class="dn${k===t?' td':''}">${d.getDate()}</span>`+hh.map(hch).join('')+l.slice(0,room).map(chip).join('')+(l.length>room?`<div class="more" data-go="${k}">+${l.length-room} more</div>`:'')+'</div>'}
  m.innerHTML=h+'</div>'}
function grid(m,n){
  const days=n===7?Array.from({length:7},(_,i)=>addD(wk(cur),i)):[cur],t=ds(new Date());
  let h=`<div class="gh" style="--n:${n}"><div></div>`+days.map(d=>`<div class="gd${ds(d)===t?' td':''}" data-go="${ds(d)}">${DAYS[(d.getDay()+6)%7]} <b>${d.getDate()}</b></div>`).join('')+'</div>';
  h+=`<div class="ga" style="--n:${n}"><div style="padding:2px 6px;text-align:right">all-day</div>`+days.map(d=>`<div class="gc">${hol(d).map(hch).join('')}${evs(d).filter(e=>e.allDay).map(chip).join('')}</div>`).join('')+'</div>';
  h+=`<div class="gb" id="gb" style="--n:${n}"><div>`+Array.from({length:24},(_,i)=>`<div class="hl">${i?ft(pad(i)+':00'):''}</div>`).join('')+'</div>';
  days.forEach(d=>{const T=evs(d).filter(e=>!e.allDay),lanes=[],P=[];
    T.forEach(e=>{const s=mi(e.start);let en=e.end&&mi(e.end)>s?mi(e.end):s+60;let k=lanes.findIndex(x=>x<=s);if(k<0){k=lanes.length;lanes.push(0)}lanes[k]=en;P.push({e,k,s,en})});
    h+=`<div class="gcol" data-d="${ds(d)}">`+P.map(p=>`<div class="ev" data-e="${p.e.id}" style="background:${col(p.e)};top:${p.s/60*48}px;height:${Math.max(20,(p.en-p.s)/60*48-2)}px;left:${p.k/lanes.length*100}%;width:${100/lanes.length}%"><b>${esc(p.e.title)}</b><br>${ft(p.e.start)}</div>`).join('');
    if(ds(d)===t){const x=new Date();h+=`<div class="now" style="top:${(x.getHours()*60+x.getMinutes())/60*48}px"></div>`}
    h+='</div>'});
  m.innerHTML=h+'</div>';$('gb').scrollTop=7.5*48}
function agenda(m){
  const from=q?addD(cur,-365):cur,span=q?731:90;let h='<div class="ag">',any=false;
  for(let i=0;i<span;i++){const d=addD(from,i),l=evs(d),hh=hol(d).filter(x=>!q||x.n.toLowerCase().includes(q));if(!l.length&&!hh.length)continue;any=true;
    h+=`<h3>${d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h3>`+
    hh.map(x=>`<div class="row" style="cursor:default"><span class="dot" style="background:${x.t==='h'?'#d93025':x.t==='f'?'#e8710a':'#8e24aa'}"></span><span class="tm">${x.t==='h'?'Holiday':x.t==='f'?'Festival':'Special day'}</span><span>${esc(x.n)}</span></div>`).join('')+l.map(e=>`<div class="row" data-e="${e.id}"><span class="dot" style="background:${col(e)}"></span><span class="tm">${e.allDay?'All day':ft(e.start)}</span><span>${esc(e.title)}</span></div>`).join('')}
  m.innerHTML=h+(any?'':'<div class="empty">No events found.</div>')+'</div>'}

/* navigation */
function nav(n){if(view==='month')cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);else if(view==='week')cur=addD(cur,7*n);else cur=addD(cur,n);render()}
$('prev').onclick=()=>nav(-1);$('next').onclick=()=>nav(1);
$('today').onclick=()=>{cur=new Date();cur.setHours(0,0,0,0);render()};
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
$('search').oninput=e=>{q=e.target.value.trim().toLowerCase();if(q)view='agenda';render()};
$('main').addEventListener('click',e=>{const t=e.target;
  if(t.closest('.hol'))return;
  const c=t.closest('[data-e]');if(c){openEv(c.dataset.e);return}
  const g=t.closest('[data-go]');if(g){cur=pd(g.dataset.go);view='day';render();return}
  const dn=t.closest('.dn');if(dn){cur=pd(dn.parentNode.dataset.d);view='day';render();return}
  const gc=t.closest('.gcol');if(gc&&t===gc){openEv(null,gc.dataset.d,pad(Math.floor(e.offsetY/48))+':00');return}
  const mc=t.closest('.mc');if(mc)openEv(null,mc.dataset.d)});

/* event dialog */
function drawCats(){$('cats').innerHTML=Object.keys(COL).map(k=>`<span class="cat${ed.cat===k?' on':''}" data-c="${k}" style="background:${COL[k]}">${k}</span>`).join('')}
$('cats').onclick=e=>{const c=e.target.closest('[data-c]');if(c){ed.cat=c.dataset.c;drawCats()}};
$('f_all').onchange=()=>{$('times').style.display=$('f_all').checked?'none':'flex'};
function openEv(id,date,time){
  const e=id?DB.events.find(x=>x.id===id):null;
  ed=e?{...e}:{id:null,title:'',date:date||ds(cur),start:time||'',end:time?pad((mi(time)/60+1)%24|0)+time.slice(2):'',allDay:!time,notes:'',cat:'Work',repeat:'none'};
  $('f_title').value=ed.title;$('f_date').value=ed.date;$('f_rep').value=ed.repeat||'none';$('f_all').checked=!!ed.allDay;
  $('f_start').value=ed.start||'';$('f_end').value=ed.end||'';$('f_notes').value=ed.notes||'';
  $('times').style.display=ed.allDay?'none':'flex';$('del').style.display=e?'':'none';
  drawCats();$('evd').style.display='flex';$('f_title').focus()}
const closeEv=()=>{$('evd').style.display='none'};
$('add').onclick=()=>openEv(null,ds(cur));
$('cancel').onclick=closeEv;
$('save').onclick=()=>{
  if(!$('f_date').value){$('f_date').focus();return}
  ed.title=$('f_title').value.trim()||'(No title)';ed.date=$('f_date').value;ed.repeat=$('f_rep').value;
  ed.allDay=$('f_all').checked;ed.start=$('f_start').value;ed.end=$('f_end').value;ed.notes=$('f_notes').value;
  if(!ed.start)ed.allDay=true;if(ed.allDay){ed.start='';ed.end=''}else if(ed.end&&mi(ed.end)<=mi(ed.start))ed.end='';
  if(ed.id){DB.events=DB.events.map(x=>x.id===ed.id?ed:x)}else{ed.id=uid();DB.events.push(ed)}
  save();closeEv();render()};
let arm=0;
$('del').onclick=()=>{if(!arm){arm=1;$('del').textContent='Click again to confirm';setTimeout(()=>{arm=0;$('del').textContent='Delete'},3000)}
  else{arm=0;$('del').textContent='Delete';DB.events=DB.events.filter(x=>x.id!==ed.id);save();closeEv();render()}};
$('f_title').onkeydown=e=>{if(e.key==='Enter')$('save').click()};

/* backup */
$('bk').onclick=()=>{$('bkd').style.display='flex'};
$('bcl').onclick=()=>{$('bkd').style.display='none'};
$('exj').onclick=()=>{$('ta').value=JSON.stringify(DB)};
$('cp').onclick=async()=>{$('ta').select();try{await navigator.clipboard.writeText($('ta').value)}catch(e){try{document.execCommand('copy')}catch(_){}}};
$('imj').onclick=()=>{try{const d=JSON.parse($('ta').value);if(!Array.isArray(d.events))throw 0;
  const have=new Set(DB.events.map(x=>x.id));d.events.forEach(x=>{if(x&&x.date&&!have.has(x.id))DB.events.push({...x,id:x.id||uid()})});
  save();$('bkd').style.display='none';render()}catch(e){$('ta').value='Invalid backup data.'}};

/* shortcuts */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeEv();$('bkd').style.display='none';return}
  if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.ctrlKey||e.metaKey||$('evd').style.display==='flex'||$('bkd').style.display==='flex')return;
  const k=e.key.toLowerCase(),V={m:'month',w:'week',d:'day',a:'agenda'};
  if(V[k]){view=V[k];render()}else if(k==='t')$('today').click();else if(k==='n'){e.preventDefault();openEv(null,ds(cur))}
  else if(k==='arrowleft')nav(-1);else if(k==='arrowright')nav(1)});
$('showh').checked=showH;
$('showh').onchange=e=>{showH=e.target.checked;try{localStorage.setItem('mycal.showh',showH?'1':'0')}catch(_){}render()};
render();
</script>
</body>
</html>
